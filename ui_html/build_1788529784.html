<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconstructed UI Canvas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #0d0d12;
      color: #f8fafc;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .ui-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 512px;
      max-height: 1024px;
      background: #0d0d12;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="ui-viewport">
    <div class="ui-input ui-6" style="position:absolute; left:0.0%; top:0.0%; width:84.75%; min-height:1596px; background:#1e293b; border:1px solid #334155; border-radius:6px; display:flex; align-items:center; padding:0 10px; box-sizing:border-box; z-index:5;">
      <input type="text" placeholder="12.30 Slot Booking Full Name Email Mobile Number Location Slot Message Write a message" style="width:100%; border:none; outline:none; background:transparent; font-size:13px; color:#f8fafc;" />
    </div>
    <div class="ui-card ui-7" style="position:absolute; left:7.29%; top:16.0%; width:84.07%; min-height:71px; background:#292b34; border:1px solid rgba(255,255,255,0.06); border-radius:6px; padding:6px 10px; box-sizing:border-box; display:flex; align-items:center; color:#f8fafc; font-size:14px; font-weight:600; z-index:3;">
      <span>Enter your name</span>
    </div>
    <div class="ui-input ui-5" style="position:absolute; left:7.29%; top:25.19%; width:84.07%; min-height:71px; background:#1e293b; border:1px solid #334155; border-radius:6px; display:flex; align-items:center; padding:0 10px; box-sizing:border-box; z-index:5;">
      <input type="text" placeholder="Enter email address" style="width:100%; border:none; outline:none; background:transparent; font-size:13px; color:#f8fafc;" />
    </div>
    <div class="ui-card ui-3" style="position:absolute; left:7.29%; top:34.56%; width:84.07%; min-height:68px; background:#272830; border:1px solid rgba(255,255,255,0.06); border-radius:6px; padding:6px 10px; box-sizing:border-box; display:flex; align-items:center; color:#f8fafc; font-size:14px; font-weight:600; z-index:3;">
      <span>Enter you number</span>
    </div>
    <div class="ui-card ui-4" style="position:absolute; left:7.29%; top:43.75%; width:84.07%; min-height:71px; background:#23232a; border:1px solid rgba(255,255,255,0.06); border-radius:6px; padding:6px 10px; box-sizing:border-box; display:flex; align-items:center; color:#f8fafc; font-size:14px; font-weight:600; z-index:3;">
      <span>Select location</span>
    </div>
    <div class="ui-card ui-8" style="position:absolute; left:7.29%; top:52.88%; width:84.07%; min-height:81px; background:#222229; border:1px solid rgba(255,255,255,0.06); border-radius:6px; padding:6px 10px; box-sizing:border-box; display:flex; align-items:center; color:#f8fafc; font-size:14px; font-weight:600; z-index:3;">
      <span>Select slot</span>
    </div>
    <div class="ui-card ui-9" style="position:absolute; left:82.03%; top:54.44%; width:5.76%; min-height:31px; background:#56575c; border:1px solid rgba(255,255,255,0.06); border-radius:6px; padding:6px 10px; box-sizing:border-box; display:flex; align-items:center; color:#f8fafc; font-size:12px; font-weight:600; z-index:3;">
      <span></span>
    </div>
    <div class="ui-card ui-0" style="position:absolute; left:3.56%; top:93.31%; width:91.53%; min-height:75px; background:#e65c55; border:1px solid rgba(255,255,255,0.06); border-radius:6px; padding:6px 10px; box-sizing:border-box; display:flex; align-items:center; color:#f8fafc; font-size:14px; font-weight:600; z-index:3;">
      <span>Send</span>
    </div>
  </div>
</body>
</html>
