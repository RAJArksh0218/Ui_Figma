<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FirstKutAI_Generated_Layout</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #242c25;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .text-header {
      color: #432e77;
      margin-bottom: 8px;
    }
    .decorative-container {
      width: 100%;
      height: 450px;
      background-color: #42105d;
      margin-top: 16px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .white-text {
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-header"></div>
    <div class="decorative-container"></div>
    <div class="white-text"></div>
  </div>
</body>
</html>
