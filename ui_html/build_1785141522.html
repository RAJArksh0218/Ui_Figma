<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: Arial, sans-serif;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #f7efef;
    padding: 24px;
  }
  .header {
    margin-bottom: 16px;
    color: #b0a7b1;
    font-size: 2.5em;
  }
  .decorative-container {
    height: 108px;
    background-color: #b71c32;
    margin-bottom: 16px;
  }
  .card-container {
    display: flex;
    justify-content: space-between;
    width: 100%;
  }
  .card {
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    background-color: #e5adb6;
    height: 269px;
    width: calc(50% - 12px);
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">1517 00 0 il</div>
  <div class="decorative-container"></div>
  <div class="card-container">
    <div class="card"></div>
    <div class="card"></div>
  </div>
</div>
</body>
</html>
