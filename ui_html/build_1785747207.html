<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #1B060A;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 207px; /* Adjust based on your design */
  }
  .row {
    display: flex;
    justify-content: space-between;
    width: 100%;
  }
  .item {
    background-color: #FFFFFF; /* Replace with actual colors */
  }
</style>
</head>
<body>
<div class="container">
  <div class="row">
    <div class="item" style="width: 24px; height: 84px;"></div>
    <div class="item" style="width: 28px; height: 44px;"></div>
    <div class="row">
      <div class="item" style="width: 27px; height: 36px;"></div>
      <div class="item" style="width: 24px; height: 27px;"></div>
      <div class="item" style="width: 23px; height: 27px;"></div>
      <div class="item" style="width: 23px; height: 26px;"></div>
      <div class="item" style="width: 8px; height: 35px;"></div>
    </div>
  </div>
  <div class="row">
    <div class="row">
      <div class="item" style="width: 14px; height: 19px;"></div>
      <div class="item" style="width: 14px; height: 15px;"></div>
      <div class="item" style="width: 13px; height: 15px;"></div>
    </div>
    <div class="row">
      <div class="item" style="width: 7px; height: 25px;"></div>
      <div class="item" style="width: 11px; height: 13px;"></div>
    </div>
  </div>
  <div class="row">
    <div class="row">
      <div class="item" style="width: 7px; height: 11px;"></div>
      <div class="item" style="width: 7px; height: 10px;"></div>
      <div class="item" style="width: 7px; height: 10px;"></div>
    </div>
  </div>
</div>
</body>
</html>
