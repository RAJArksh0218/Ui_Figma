<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  .container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    justify-content: space-between;
    align-items: center;
    background-color: #987568;
  }
  
  .decorative-container {
    flex: 1;
    border-radius: 12px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.26);
  }

  .text-block {
    font-size: 2rem;
    color: #6d768f;
  }
</style>
</head>
<body>
<div class="container">
  <div class="decorative-container" style="background-color:#888490;"></div>
  <div class="decorative-container" style="background-color:#9695a4;"></div>
  <div class="decorative-container" style="background-color:#9b8c8d;"></div>
  <div class="decorative-container" style="background-color:#747c94;"></div>
  <div class="text-block">soui</div>
  <div class="decorative-container" style="background-color:#6d768f;"></div>
</div>
</body>
</html>
