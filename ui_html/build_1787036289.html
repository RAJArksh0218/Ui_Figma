<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexoRyd - Let's set up your profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1e293b;
    }

    /* Container modeling the device layout */
    .mobile-container {
      width: 100%;
      max-width: 375px;
      height: 812px;
      background-color: #e5ebf5;
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Header & Status Bar Mock */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 24px;
    }

    .status-icons {
      display: flex;
      gap: 6px;
    }

    /* Title section */
    .header {
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.2;
    }

    .header p {
      font-size: 15px;
      color: #64748b;
      margin-top: 6px;
    }

    /* Form Content */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      border: none;
      outline: none;
      background-color: #ffffff;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      color: #1e293b;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      transition: box-shadow 0.2s ease;
    }

    .form-control:focus {
      box-shadow: 0 0 0 2px #3b82f6;
    }

    /* Gender selection layout */
    .gender-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .gender-option {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.2s ease;
      background-color: #f9f9fa;
      border: 1px solid transparent;
      user-select: none;
    }

    .gender-option.active {
      background-color: #e4edfb;
      color: #1e40af;
      border-color: #3b82f6;
      font-weight: 600;
    }

    /* Bottom operations */
    .footer {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .btn-continue {
      width: 100%;
      background-color: #1e293b;
      color: #ffffff;
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-continue:hover {
      background-color: #0f172a;
    }

    .terms {
      font-size: 11px;
      text-align: center;
      color: #64748b;
      line-height: 1.5;
    }

    .terms a {
      color: #1e293b;
      font-weight: 600;
      text-decoration: none;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    /* Bottom indicator line */
    .bottom-indicator {
      width: 48px;
      height: 6px;
      background-color: #cfdbef;
      border-radius: 3px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <div>
      <!-- Status Bar Area -->
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
          <span>📶</span>
          <span>📶</span>
          <span>🔋</span>
        </div>
      </div>

      <!-- Welcome Message Header -->
      <div class="header">
        <h1>Welcome to NexoRyd</h1>
        <p>Let's set up your profile</p>
      </div>

      <!-- Main Registration Form -->
      <form id="profileForm" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-control" value="Rajendra Prasad">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" value="rajendra@gmail.com">
        </div>

        <div class="form-group">
          <label>Gender</label>
          <div class="gender-row">
            <div class="gender-option active" onclick="selectGender(this, 'Male')">Male</div>
            <div class="gender-option" onclick="selectGender(this, 'Female')">Female</div>
            <div class="gender-option" onclick="selectGender(this, 'Others')">Others</div>
          </div>
        </div>
      </form>
    </div>

    <!-- Navigation & Bottom Legal Area -->
    <div class="footer">
      <button class="btn-continue" onclick="handleContinue()">Continue</button>
      <p class="terms">
        By continuing, you agree to our 
        <a href="#">Terms of Service</a> & 
        <a href="#">Privacy Policy</a>
      </p>
      <div class="bottom-indicator"></div>
    </div>
  </div>

  <script>
    let selectedGender = 'Male';

    function selectGender(element, val) {
      // Remove active class from all options
      document.querySelectorAll('.gender-option').forEach(el => {
        el.classList.remove('active');
      });
      // Add active class to the selected option
      element.classList.add('active');
      selectedGender = val;
    }

    function handleContinue() {
      const name = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      alert(`Continuing setup for:\nName: ${name}\nEmail: ${email}\nGender: ${selectedGender}`);
    }
  </script>
</body>
</html>
