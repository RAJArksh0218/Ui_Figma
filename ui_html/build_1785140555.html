<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #0e0f1c;
    }
    .container {
      width: 100%;
      box-sizing: border-box;
    }
    .main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1e1925;
    }
    .header {
      width: 80%;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: #2d181b;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="container" style="background-color: #0e0f1c; flex: 1;"></div>
    <div class="container" style="background-color: #1e1925; flex: 1;"></div>
    <div class="container" style="background-color: #1a1b29; height: 376px; width: 220px;"></div>
    <div class="container" style="background-color: #221f2b; height: 60px; width: 64px;"></div>
    <div class="header">Heading</div>
    <div class="container" style="background-color: #1f1014; height: 262px; width: 391px;"></div>
  </div>
</body>
</html>
