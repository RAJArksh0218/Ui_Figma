<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Processing Flowchart</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root {
            --bg-color: #f8f8f8; /* Light off-white background */
            --blue-step: #5492ce;
            --teal-step: #62b6a6;
            --green-step: #77a86a;
            --orange-step: #eba84c;
            --red-step: #d5665d;
            --dark-red-step: #d88a83;

            --button-json: #e5e2e2;
            --button-pdf: #e8e7e7;
            --button-display: #dad9d9;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align to the top */
            min-height: 100vh;
            margin: 20px 0; /* Add vertical margin */
            padding: 0;
            color: #333;
        }

        .container {
            width: 320px; /* Max width for the flow chart */
            display: flex;
            flex-direction: column;
            gap: 15px; /* Spacing between blocks and arrows */
        }

        .flow-block {
            background-color: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            color: white; /* Text color for the blocks */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px; /* Minimum height for consistency */
            position: relative; /* For icon positioning */
        }

        .flow-block.step-1 { background-color: var(--blue-step); }
        .flow-block.step-2 { background-color: var(--teal-step); }
        .flow-block.step-3 { background-color: var(--green-step); }
        .flow-block.step-4 { background-color: var(--orange-step); }
        .flow-block.step-6 { background-color: var(--red-step); }
        .flow-block.step-7 { background-color: var(--dark-red-step); }

        .flow-block h2 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 8px;
            margin-top: 0;
        }

        .flow-block p {
            font-size: 14px;
            font-weight: 400;
            margin: 0;
            opacity: 0.9;
        }

        .flow-block .icon-wrapper {
            margin-top: 15px;
            font-size: 36px;
            line-height: 1; /* Ensure icon doesn't add extra height */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 40px; /* Fixed height for icon area */
        }

        .flow-block .icon-wrapper i {
            color: white;
        }

        /* Custom icons */
        .icon-pdf-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 16px; /* Text size within icon */
        }
        .icon-pdf-text .fa-file-alt {
            font-size: 30px; /* Icon size */
            margin-bottom: -5px; /* Adjust to bring text closer */
        }
        .icon-pdf-text span {
            font-size: 12px;
            font-weight: bold;
        }

        .icon-json {
            font-size: 36px;
            font-weight: bold;
            line-height: 1;
        }

        .icon-query {
            position: relative;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .icon-query .fa-search {
            font-size: 36px; /* Larger search icon */
        }
        .icon-query .fa-question {
            position: absolute;
            font-size: 20px; /* Smaller question mark */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white; /* Ensure question mark is visible */
            text-shadow: 0 0 5px rgba(0,0,0,0.3); /* Slight shadow to make it pop */
        }


        .arrow {
            text-align: center;
            font-size: 30px;
            color: #bbb;
            margin: -5px 0; /* Adjust vertical position of arrows */
        }
        .arrow i {
            vertical-align: middle;
        }

        .export-buttons {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        .export-btn {
            background-color: rgba(255, 255, 255, 0.2); /* Semi-transparent white for buttons */
            color: #333; /* Darker text for readability on lighter buttons */
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: background-color 0.2s ease;
            flex: 1; /* Distribute space evenly */
        }

        .export-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* Specific button colors from JSON */
        .export-btn.json { background-color: var(--button-json); }
        .export-btn.pdf { background-color: var(--button-pdf); }
        .export-btn.web { background-color: var(--button-display); }

    </style>
</head>
<body>
    <div class="container">
        <div class="flow-block step-1">
            <h2>1. Upload PDF</h2>
            <div class="icon-wrapper icon-pdf-text">
                <i class="fas fa-file-alt"></i>
                <span>PDF</span>
            </div>
        </div>
        <div class="arrow"><i class="fas fa-arrow-down"></i></div>

        <div class="flow-block step-2">
            <h2>2. Extract Text from PDF</h2>
            <div class="icon-wrapper">
                <i class="fas fa-file-alt"></i>
            </div>
        </div>
        <div class="arrow"><i class="fas fa-arrow-down"></i></div>

        <div class="flow-block step-3">
            <h2>3. Convert to JSON</h2>
            <div class="icon-wrapper icon-json">
                { }
            </div>
        </div>
        <div class="arrow"><i class="fas fa-arrow-down"></i></div>

        <div class="flow-block step-4">
            <h2>4. Process Query</h2>
            <p>Ask Questions</p>
            <div class="icon-wrapper icon-query">
                <i class="fas fa-search"></i>
                <i class="fas fa-question"></i>
            </div>
        </div>
        <div class="arrow"><i class="fas fa-arrow-down"></i></div>

        <div class="flow-block step-6">
            <h2>6. Generate Answer</h2>
            <!-- No icon explicitly shown in the original image for this step -->
            <div class="icon-wrapper" style="font-size: 0;"></div> <!-- Keep space consistent -->
        </div>
        <div class="arrow"><i class="fas fa-arrow-down"></i></div>

        <div class="flow-block step-7">
            <h2>7. Export Results</h2>
            <div class="export-buttons">
                <div class="export-btn json">JSON</div>
                <div class="export-btn pdf">PDF</div>
                <div class="export-btn web">Display<br>on Web</div>
            </div>
        </div>
    </div>
</body>
</html>
