<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pickup Location Search</title>
  <style>
    :root {
      --bg-primary: #f7f7f8;
      --bg-secondary: #f5f5f6;
      --text-main: #2d3142;
      --accent-color: #007aff;
      --card-bg: #fefefe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #e5e5e5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Device Mockup Wrapper */
    .device-container {
      width: 375px;
      height: 812px;
      background-color: var(--bg-primary);
      border-radius: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
      border: 8px solid #222;
      display: flex;
      flex-direction: column;
    }

    /* StatusBar Simulator */
    .status-bar {
      height: 44px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: #000;
      background-color: var(--bg-secondary);
      z-index: 10;
    }

    /* Main Search Panel (Child 1) */
    .search-panel {
      background-color: var(--bg-secondary);
      padding: 16px;
      border-bottom: 1px solid #e2e2e4;
      z-index: 10;
    }

    .search-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }

    .header-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-main);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #e1e3e6;
      border-radius: 10px;
      padding: 10px 14px;
      gap: 10px;
    }

    .input-wrapper input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 14px;
      color: var(--text-main);
    }

    .dot-green {
      width: 8px;
      height: 8px;
      background-color: #34c759;
      border-radius: 50%;
    }

    .dot-grey {
      width: 8px;
      height: 8px;
      background-color: #8e8e93;
      border-radius: 50%;
    }

    /* Results Layer (Child 0 & icons 4, 5, 6) */
    .results-container {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      background-color: var(--bg-primary);
      margin-bottom: 80px; /* Space for bottom panel */
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: #8e8e93;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .recent-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eef0f2;
      gap: 16px;
      cursor: pointer;
    }

    .recent-item:last-child {
      border-bottom: none;
    }

    /* Configurable decorative container matches (Child 4, 5, 6) */
    .icon-box {
      width: 36px;
      height: 36px;
      background-color: #e8eaec;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #636e72;
      font-size: 16px;
      flex-shrink: 0;
    }

    .item-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .item-subtitle {
      font-size: 12px;
      color: #8e8e93;
    }

    /* Bottom Panel Sheet (Child 2) */
    .bottom-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background-color: var(--card-bg);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 16px;
      z-index: 12;
    }

    .bottom-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #8e8e93;
      text-decoration: none;
      font-size: 10px;
      font-weight: 500;
    }

    .bottom-tab.active {
      color: var(--accent-color);
    }

    .bottom-tab svg {
      width: 22px;
      height: 22px;
    }
  </style>
</head>
<body>

  <div class="device-container">
    <!-- Simulator Top bar -->
    <div class="status-bar">
      <span>9:41</span>
      <span style="font-size: 12px;">🔋 📶</span>
    </div>

    <!-- Search Section (Child 1) -->
    <div class="search-panel">
      <div class="search-header">
        <button class="back-btn">←</button>
        <span class="header-title">Pickup Location</span>
      </div>
      <div class="input-group">
        <div class="input-wrapper">
          <span class="dot-green"></span>
          <input type="text" value="Current Location" readonly>
        </div>
        <div class="input-wrapper">
          <span class="dot-grey"></span>
          <input type="text" placeholder="Search for location..." autofocus>
        </div>
      </div>
    </div>

    <!-- Results Section (Child 0 Container mapping) -->
    <div class="results-container">
      <div class="section-title">Recent Searches</div>

      <!-- Result Item with Custom Icons mapped as container widgets (Child 4, 5, 6) -->
      <div class="recent-item">
        <div class="icon-box">📍</div>
        <div class="item-details">
          <div class="item-title">Secunderabad</div>
          <div class="item-subtitle">Sth Block Rd No 14, Secunderabad</div>
        </div>
      </div>

      <div class="recent-item">
        <div class="icon-box">🏢</div>
        <div class="item-details">
          <div class="item-title">Tech Mahindra Office</div>
          <div class="item-subtitle">Block 7, Kukatpally Main Junction, Hyd</div>
        </div>
      </div>

      <div class="recent-item">
        <div class="icon-box">🍕</div>
        <div class="item-details">
          <div class="item-title">Pista House</div>
          <div class="item-subtitle">Door No 5, Near VED Address, Hyderabad</div>
        </div>
      </div>

      <div class="recent-item">
        <div class="icon-box">🏠</div>
        <div class="item-details">
          <div class="item-title">Home</div>
          <div class="item-subtitle">Friends Colony, Block 7, Kukatpally</div>
        </div>
      </div>
    </div>

    <!-- Bottom Sheet Navigation (Child 2) -->
    <div class="bottom-panel">
      <a href="#" class="bottom-tab active">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        Map View
      </a>
      <a href="#" class="bottom-tab">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        Favorites
      </a>
      <a href="#" class="bottom-tab">
        <svg fill="currentColor" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        Settings
      </a>
    </div>
  </div>

</body>
</html>
