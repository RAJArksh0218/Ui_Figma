<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FirstKutAI_Generated_Layout</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #FFFFFF;
    }
    .container {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
    }
    .header {
      font-size: 24px;
      color: #e5e5e8;
    }
    .text-block {
      font-size: 16px;
      color: #f5f5f6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Admin Upload New CSV</div>
    <div class="header">Data Source CPCB India</div>
  </div>
  <div class="container" style="background-color: #e5e5e8;">
    <div class="header">Retrain Model</div>
    <div class="header">Data Preprocessing</div>
  </div>
  <div class="container" style="background-color: #f5f5f6;">
    <div class="text-block">Prediction Engine</div>
  </div>
  <div class="container" style="background-color: #e7e7e9;">
    <div class="header">Output Realtime AQI Score</div>
  </div>
</body>
</html>
