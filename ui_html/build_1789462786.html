<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Booking</title>
    <style>
        :root {
            --bg-main: #211b22;
            --bg-card: #211b23;
            --bg-input-name: #292b34;
            --bg-input-email: #292b35;
            --bg-input-phone: #272830;
            --bg-input-location: #23232a;
            --bg-input-slot: #222229;
            --bg-input-message: #221c23;
            --accent-color: #e65c55;
            --text-color: #ffffff;
            --text-secondary: #a09fa1;
            --dropdown-icon: #56575c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .booking-card {
            background-color: var(--bg-card);
            width: 100%;
            max-width: 580px;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header .badge {
            background-color: rgba(230, 92, 85, 0.15);
            color: var(--accent-color);
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
            padding-left: 4px;
        }

        .form-control {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1.5px solid transparent;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(230, 92, 85, 0.15);
        }

        /* Specific input backgrounds based on DesignIR spec */
        #name { background-color: var(--bg-input-name); }
        #email { background-color: var(--bg-input-email); }
        #phone { background-color: var(--bg-input-phone); }
        #location { background-color: var(--bg-input-location); }
        #slot { background-color: var(--bg-input-slot); }
        #message { background-color: var(--bg-input-message); }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2356575c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 18px;
            padding-right: 40px;
            cursor: pointer;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: var(--text-color);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 16px;
            letter-spacing: 0.8px;
        }

        .btn-submit:hover {
            background-color: #ef6b64;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        @media (max-width: 480px) {
            .booking-card {
                padding: 24px;
                border-radius: 16px;
            }
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="booking-card">
        <div class="header">
            <h1>Slot Booking</h1>
            <div class="badge">12:30 PM</div>
        </div>

        <form id="slotBookingForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="Enter email address" required>
            </div>

            <div class="form-group">
                <label for="phone">Mobile Number</label>
                <input type="tel" id="phone" class="form-control" placeholder="Enter your number" required>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <select id="location" class="form-control" required>
                    <option value="" disabled selected hidden>Select location</option>
                    <option value="new-york">New York</option>
                    <option value="london">London</option>
                    <option value="tokyo">Tokyo</option>
                    <option value="paris">Paris</option>
                </select>
            </div>

            <div class="form-group">
                <label for="slot">Slot</label>
                <select id="slot" class="form-control" required>
                    <option value="" disabled selected hidden>Select slot</option>
                    <option value="morning">09:00 AM - 10:00 AM</option>
                    <option value="noon">12:30 PM - 01:30 PM</option>
                    <option value="afternoon">03:00 PM - 04:00 PM</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" class="form-control" placeholder="Write a message..." rows="4"></textarea>
            </div>

            <button type="submit" class="btn-submit">Send</button>
        </form>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            alert("Slot booked successfully!");
        }
    </script>
</body>
</html>
