<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f7f7f8;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">

  <!-- Mobile View Container -->
  <div class="w-full max-w-md bg-[#f7f7f8] min-h-screen sm:min-h-[812px] sm:rounded-3xl sm:shadow-2xl overflow-hidden flex flex-col justify-between border border-gray-100">
    
    <!-- Top Search Header Card -->
    <div class="bg-white p-5 shadow-sm border-b border-gray-100">
      <!-- Title & Back Button -->
      <div class="flex items-center gap-3 mb-4">
        <button class="text-gray-700 hover:bg-gray-100 p-2 rounded-full transition">
          <i class="fa-solid fa-arrow-left text-lg"></i>
        </button>
        <h1 class="text-lg font-bold text-gray-800">Locate on Map</h1>
      </div>

      <!-- Input Section (ID 1 & 13 equivalent layout) -->
      <div class="bg-[#f1f2f5] p-4 rounded-xl space-y-3">
        <!-- Current Location Input -->
        <div class="flex items-center gap-3">
          <span class="w-2.5 h-2.5 rounded-full bg-blue-500 ring-4 ring-blue-100"></span>
          <div class="flex-1">
            <label class="block text-[10px] text-gray-400 font-semibold uppercase tracking-wider">Start Point</label>
            <input type="text" value="Current Location" class="w-full bg-transparent text-sm font-semibold text-gray-800 focus:outline-none" />
          </div>
        </div>
        
        <hr class="border-gray-200">

        <!-- Destination Input -->
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-location-dot text-red-500 text-sm"></i>
          <div class="flex-1">
            <label class="block text-[10px] text-gray-400 font-semibold uppercase tracking-wider">Destination</label>
            <input type="text" placeholder="Enter destination" class="w-full bg-transparent text-sm text-gray-600 focus:outline-none" />
          </div>
        </div>
      </div>

      <!-- Quick Action Pill (ID 4 & 5 area) -->
      <div class="flex gap-2 mt-4">
        <button class="flex items-center gap-2 bg-[#e1eaf9] hover:bg-blue-100 text-blue-600 px-3 py-1.5 rounded-full text-xs font-bold transition">
          <i class="fa-solid fa-location-crosshairs text-[11px]"></i>
          <span>Use Current Location</span>
        </button>
      </div>
    </div>

    <!-- Saved Addresses List (ID 6, 7, 8 & Labels area) -->
    <div class="flex-1 p-5 overflow-y-auto space-y-4">
      <h2 class="text-xs font-bold text-gray-400 tracking-wider uppercase mb-2">Saved Addresses</h2>

      <!-- Home Row (ID 7, 9, 11) -->
      <div class="flex items-center justify-between bg-white p-3.5 rounded-xl shadow-sm border border-gray-50 hover:border-blue-100 cursor-pointer transition">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-[#ebedef] rounded-full flex items-center justify-center text-gray-600">
            <i class="fa-solid fa-house text-sm"></i>
          </div>
          <div>
            <h3 class="font-bold text-sm text-gray-800">Home</h3>
            <p class="text-xs text-gray-400 max-w-[180px] truncate">Block 7, Kukatpally, Hyderabad</p>
          </div>
        </div>
        <span class="text-xs font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-md">4.7 Km</span>
      </div>

      <!-- Work Row (ID 8, 12, 10) -->
      <div class="flex items-center justify-between bg-white p-3.5 rounded-xl shadow-sm border border-gray-50 hover:border-blue-100 cursor-pointer transition">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-[#eaecee] rounded-full flex items-center justify-center text-gray-600">
            <i class="fa-solid fa-briefcase text-sm"></i>
          </div>
          <div>
            <h3 class="font-bold text-sm text-gray-800">Work</h3>
            <p class="text-xs text-gray-400 max-w-[180px] truncate">Tech Mahindra Office, Bahadurpally</p>
          </div>
        </div>
        <span class="text-xs font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-md">8.5 Km</span>
      </div>

      <!-- Friends Row (ID 6, 17, 15) -->
      <div class="flex items-center justify-between bg-white p-3.5 rounded-xl shadow-sm border border-gray-50 hover:border-blue-100 cursor-pointer transition">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-[#ecedef] rounded-full flex items-center justify-center text-gray-600">
            <i class="fa-solid fa-user-group text-sm"></i>
          </div>
          <div>
            <h3 class="font-bold text-sm text-gray-800">Friends</h3>
            <p class="text-xs text-gray-400 max-w-[180px] truncate">Door No 4-733/1A, Secunderabad</p>
          </div>
        </div>
        <span class="text-xs font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-md">12 Km</span>
      </div>
    </div>

    <!-- Bottom Nav Bar (ID 2 visual) -->
    <div class="bg-white border-t border-gray-200 h-16 px-6 flex items-center justify-around sm:rounded-b-3xl">
      <button class="flex flex-col items-center gap-1 text-blue-500">
        <i class="fa-solid fa-compass text-lg"></i>
        <span class="text-[10px] font-bold">Explore</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-blue-500 transition">
        <i class="fa-solid fa-bookmark text-lg"></i>
        <span class="text-[10px] font-medium">Saved</span>
      </button>
      <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-blue-500 transition">
        <i class="fa-solid fa-user text-lg"></i>
        <span class="text-[10px] font-medium">Profile</span>
      </button>
    </div>

  </div>

</body>
</html>
