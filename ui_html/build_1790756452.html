<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pickup Location Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f0f2f5;
    }
    /* Simulated Mobile Frame Wrapper */
    .phone-container {
      max-width: 380px;
      height: 780px;
      border: 8px solid #2d3748;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      background-color: #f7f7f8;
      position: relative;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

  <!-- Phone Mockup Container -->
  <div class="phone-container flex flex-col relative">
    
    <!-- Status Bar Area (Standard iOS / Android simulation) -->
    <div class="bg-[#f5f5f6] px-6 pt-4 pb-2 flex justify-between items-center text-xs font-semibold text-gray-700">
      <span>9:41</span>
      <div class="flex items-center space-x-1.5">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.93 20.26 10.93 20.5 12 20.5c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      </div>
    </div>

    <!-- Header Input Section (ID 1 area) -->
    <div class="bg-[#f5f5f6] px-6 pb-6 rounded-b-3xl shadow-sm">
      <h1 class="text-2xl font-bold text-gray-800 mb-4">Pickup Location</h1>
      
      <!-- Search Input -->
      <div class="bg-white flex items-center rounded-xl px-3.5 py-2.5 shadow-sm border border-gray-100">
        <svg class="w-5 h-5 text-gray-400 mr-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" placeholder="Search for location..." class="w-full bg-transparent outline-none text-sm text-gray-700 placeholder-gray-400 font-medium">
      </div>

      <!-- Current Location Action -->
      <div class="flex items-center mt-3 text-blue-600 cursor-pointer hover:opacity-80 transition">
        <svg class="w-4 h-4 mr-1.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1c0-.55-.45-1-1-1s-1 .45-1 1v2.06C6.83 3.52 3.52 6.83 3.06 11H1c-.55 0-1 .45-1 1s.45 1 1 1h2.06c.46 4.17 3.77 7.48 7.94 7.94V23c0 .55.45 1 1 1s1-.45 1-1v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23c.55 0 1-.45 1-1s-.45-1-1-1h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
        <span class="text-xs font-semibold">Use Current Location</span>
      </div>
    </div>

    <!-- Recent Searches Title -->
    <div class="px-6 pt-5 pb-2">
      <h2 class="text-xs font-extrabold text-gray-400 tracking-wider">RECENT SEARCHES</h2>
    </div>

    <!-- Location Items List (Simulating IDs 4, 5, 6 containers & labels) -->
    <div class="flex-1 overflow-y-auto scrollbar-none px-6 space-y-3 pb-24">
      
      <!-- Item 1 -->
      <div class="bg-white p-3 rounded-2xl flex items-center shadow-sm border border-gray-50 hover:shadow-md transition cursor-pointer">
        <!-- Circular Container ID 4 -->
        <div class="w-10 h-10 rounded-full bg-[#e8eaec] flex items-center justify-center text-gray-500 mr-4 flex-shrink-0">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="text-sm font-bold text-gray-800 truncate">Tech Mahendra Office</h4>
          <p class="text-xs text-gray-400 truncate">Block 7, Kukatpally Main Junction, Hyd</p>
        </div>
        <span class="text-xs font-bold text-blue-500 ml-2 whitespace-nowrap">2.6 km</span>
      </div>

      <!-- Item 2 -->
      <div class="bg-white p-3 rounded-2xl flex items-center shadow-sm border border-gray-50 hover:shadow-md transition cursor-pointer">
        <!-- Circular Container ID 5 -->
        <div class="w-10 h-10 rounded-full bg-[#e8eaec] flex items-center justify-center text-gray-500 mr-4 flex-shrink-0">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="text-sm font-bold text-gray-800 truncate">Pista House</h4>
          <p class="text-xs text-gray-400 truncate">Door No 5, Near Metro Pillar 47</p>
        </div>
        <span class="text-xs font-bold text-blue-500 ml-2 whitespace-nowrap">4.2 km</span>
      </div>

      <!-- Item 3 -->
      <div class="bg-white p-3 rounded-2xl flex items-center shadow-sm border border-gray-50 hover:shadow-md transition cursor-pointer">
        <!-- Circular Container ID 6 -->
        <div class="w-10 h-10 rounded-full bg-[#e8eaec] flex items-center justify-center text-gray-500 mr-4 flex-shrink-0">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <h4 class="text-sm font-bold text-gray-800 truncate">Home (5th Block)</h4>
          <p class="text-xs text-gray-400 truncate">Road No 14, Secunderabad</p>
        </div>
        <span class="text-xs font-bold text-blue-500 ml-2 whitespace-nowrap">12 km</span>
      </div>

    </div>

    <!-- Bottom Actions Container (ID 2 representation) -->
    <div class="absolute bottom-4 left-4 right-4 bg-[#fefefe] h-[75px] rounded-2xl shadow-lg flex items-center justify-between px-4 border border-gray-100">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        </div>
        <div>
          <h4 class="text-sm font-bold text-gray-800">Saved Address</h4>
          <p class="text-xs text-gray-400">Go to home easily</p>
        </div>
      </div>
      <button class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

  </div>

</body>
</html>
