<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slot Booking Form</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #211b22;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .container {
    width: 587px;
    background-color: #211b22;
    display: flex;
    flex-direction: column;
  }
  .input-container {
    flex: 314;
    background-color: #221c23;
    display: flex;
    flex-direction: column;
  }
  .button-container {
    flex: 6;
    background-color: #a94740;
  }
  .text {
    text-align: center;
    color: white;
    font-size: 20px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="input-container">
    <div class="button-container"></div>
    <div class="text">Send</div>
  </div>
  <div class="input-container">
    <div class="button-container"></div>
    <div class="text">Select slot</div>
  </div>
  <div class="input-container">
    <div class="button-container"></div>
    <div class="text">Select location</div>
  </div>
  <div class="input-container">
    <div class="button-container"></div>
    <div class="text">Enter you number</div>
  </div>
  <div class="input-container">
    <div class="button-container"></div>
    <div class="text">Enter email address</div>
  </div>
</div>
</body>
</html>
