<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextBlob Sentiment Distribution</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --chart-height: 250px; /* Visual height for the bars themselves (0 to 45000) */
            --max-value: 45000;
            --x-axis-label-height: 22px; /* Space for X-axis labels + padding */
            --y-axis-width: 60px; /* Width for 'Count' label and numbers */
            --gap-y-axis-bars: 15px; /* Gap between Y-axis numbers and bars */
            --count-label-offset: 5px; /* Offset for 'Count' label from left edge of y-axis-wrapper */
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .chart-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 25px;
            width: 700px; /* Adjust width as needed */
            box-sizing: border-box;
        }

        .chart-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            text-align: left;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #333;
        }

        .legend-color-swatch {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            margin-right: 8px;
            border: 1px solid #333;
        }

        /* Chart content area (Y-axis and Bars) */
        .chart-content {
            display: flex;
            align-items: flex-end; /* Align bottom of y-axis numbers and bars */
        }

        .y-axis-wrapper {
            position: relative;
            width: var(--y-axis-width);
            height: calc(var(--chart-height) + var(--x-axis-label-height)); /* Total height to align 'Count' correctly */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end; /* Align numbers to the right */
        }

        .y-axis-label-count {
            position: absolute;
            left: var(--count-label-offset); /* Offset from left edge of y-axis-wrapper */
            top: 50%; /* Center vertically before rotation */
            transform: translateY(-50%) rotate(-90deg); /* Center and rotate */
            transform-origin: left center; /* Rotate around its left center */
            font-size: 14px;
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .y-axis-numbers {
            height: var(--chart-height); /* This height corresponds to the bar plotting area */
            width: calc(100% - var(--count-label-offset)); /* Take remaining width in y-axis-wrapper */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 12px;
            color: #555;
            text-align: right;
            margin-top: auto; /* Push numbers to the bottom, aligning 0 with chart base */
        }

        .bars-area-container {
            position: relative;
            flex: 1; /* Take remaining space */
            height: var(--chart-height); /* Height of the actual plotting area */
            border-left: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            margin-left: var(--gap-y-axis-bars); /* Gap between Y-axis and bars */
            padding-bottom: var(--x-axis-label-height); /* Space for x-axis labels */
            display: flex; /* For bars-wrapper inside */
            align-items: flex-end; /* Bars align to bottom */
            box-sizing: border-box;
        }

        /* Horizontal grid lines */
        .grid-line {
            position: absolute;
            left: 0;
            width: 100%;
            border-bottom: 1px solid #eee; /* Lighter color for grid lines */
            z-index: 0; /* Place behind bars */
        }
        .grid-line:first-child { /* The 0-line, already covered by border-bottom of bars-area-container */
            display: none;
        }

        /* Bars container */
        .bars-wrapper {
            display: flex;
            flex: 1;
            justify-content: space-around;
            height: 100%; /* Occupy full height of bars-area-container minus padding */
            z-index: 1; /* Place bars above grid lines */
        }

        /* Individual bar columns */
        .bar-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Align bar and label to the bottom */
            width: 60px; /* Fixed width for each bar column */
            box-sizing: border-box;
        }

        .bar-value {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .bar {
            width: 40px;
            border: 1px solid #333;
            border-radius: 4px 4px 0 0; /* Rounded top corners */
        }

        .x-axis-label {
            font-size: 12px;
            color: #555;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <h2 class="chart-title">TextBlob Sentiment Distribution</h2>
        <div class="legend">
            <div class="legend-item">
                <span class="legend-color-swatch" style="background-color: #009587;"></span>
                TextBlob Positive
            </div>
            <div class="legend-item">
                <span class="legend-color-swatch" style="background-color: #b41b1b;"></span>
                TextBlob Negative
            </div>
            <div class="legend-item">
                <span class="legend-color-swatch" style="background-color: #c1c1c1;"></span>
                TextBlob Neutral
            </div>
        </div>

        <div class="chart-content">
            <div class="y-axis-wrapper">
                <span class="y-axis-label-count">Count</span>
                <div class="y-axis-numbers">
                    <span>40000</span>
                    <span>30000</span>
                    <span>20000</span>
                    <span>10000</span>
                    <span>0</span>
                </div>
            </div>

            <div class="bars-area-container">
                <!-- Horizontal grid lines -->
                <div class="grid-line" style="bottom: calc(10000 / var(--max-value) * var(--chart-height));"></div>
                <div class="grid-line" style="bottom: calc(20000 / var(--max-value) * var(--chart-height));"></div>
                <div class="grid-line" style="bottom: calc(30000 / var(--max-value) * var(--chart-height));"></div>
                <div class="grid-line" style="bottom: calc(40000 / var(--max-value) * var(--chart-height));"></div>
                
                <div class="bars-wrapper">
                    <div class="bar-column">
                        <span class="bar-value">45000</span>
                        <div class="bar" style="height: calc(45000 / var(--max-value) * var(--chart-height)); background-color: #009587;"></div>
                        <span class="x-axis-label">Positive</span>
                    </div>
                    <div class="bar-column">
                        <span class="bar-value">25000</span>
                        <div class="bar" style="height: calc(25000 / var(--max-value) * var(--chart-height)); background-color: #b41b1b;"></div>
                        <span class="x-axis-label">Negative</span>
                    </div>
                    <div class="bar-column">
                        <span class="bar-value">30000</span>
                        <div class="bar" style="height: calc(30000 / var(--max-value) * var(--chart-height)); background-color: #c1c1c1;"></div>
                        <span class="x-axis-label">Neutral</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
