<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexoRyd - Set Up Profile</title>
    <!-- Tailwind CSS for sleek utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #cbd5e1 100%);
        }
        .app-shell {
            background-color: #e5ebf5;
            width: 100%;
            max-width: 410px;
            height: 840px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 8px solid #1e293b;
        }
        .custom-shadow {
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Mobile Device Frame Container -->
    <div class="app-shell flex flex-col justify-between p-6">
        
        <!-- Native Top Bar Mimic -->
        <div class="flex justify-between items-center text-slate-800 text-sm font-semibold px-2 pt-2">
            <span>9:41</span>
            <div class="flex items-center gap-1.5">
                <!-- Reception Icon -->
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M2 22h20V2z"/></svg>
                <!-- Wifi Icon -->
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21l-12-18h24z"/></svg>
                <!-- Battery Icon -->
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17 5H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/></svg>
            </div>
        </div>

        <!-- Scrollable Main Content -->
        <div class="flex-1 overflow-y-auto no-scrollbar py-6 px-2">
            <!-- Header Block -->
            <div class="mb-8">
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Welcome to NexoRyd</h1>
                <p class="text-slate-500 text-sm mt-1.5 font-medium">Let's set up your profile</p>
            </div>

            <!-- Profile Form -->
            <div class="space-y-5">
                <!-- Full Name input -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Full Name</label>
                    <input type="text" value="Rajendra Prasad" 
                        class="w-full bg-white text-slate-800 font-semibold px-4 py-3.5 rounded-2xl custom-shadow focus:outline-none focus:ring-2 focus:ring-slate-400 transition-all border-0">
                </div>

                <!-- Email Address input -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email Address</label>
                    <input type="email" value="rajendra@gmail.com" 
                        class="w-full bg-white text-slate-800 font-semibold px-4 py-3.5 rounded-2xl custom-shadow focus:outline-none focus:ring-2 focus:ring-slate-400 transition-all border-0">
                </div>

                <!-- Gender Selector Component -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Gender</label>
                    <div class="grid grid-cols-3 gap-3">
                        <button onclick="selectGender(this, 'Male')" class="gender-btn py-3.5 rounded-xl font-bold transition-all text-sm bg-slate-900 text-white shadow-md">
                            Male
                        </button>
                        <button onclick="selectGender(this, 'Female')" class="gender-btn py-3.5 rounded-xl font-bold transition-all text-sm bg-[#f9f9fa] text-slate-800">
                            Female
                        </button>
                        <button onclick="selectGender(this, 'Others')" class="gender-btn py-3.5 rounded-xl font-bold transition-all text-sm bg-[#f9f9fa] text-slate-800">
                            Others
                        </button>
                    </div>
                </div>
            </div>

            <!-- Action Area -->
            <div class="mt-10">
                <button onclick="submitForm()" class="w-full bg-slate-950 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl transition-all shadow-lg active:scale-[0.99]">
                    Continue
                </button>
            </div>
        </div>

        <!-- Sticky Footer and Status bar indicator -->
        <div class="flex flex-col items-center gap-4 pt-2">
            <a href="#" class="text-xs font-semibold text-slate-500 underline tracking-wide hover:text-slate-800 transition-colors">
                Terms of Service & Privacy Policy
            </a>
            <!-- Safe Area Bottom Pill -->
            <div class="w-12 h-1.5 bg-[#cfdbef] rounded-full"></div>
        </div>

    </div>

    <!-- Interactive Layer Implementation -->
    <script>
        let chosenGender = "Male";

        function selectGender(element, val) {
            // Reset all gender buttons
            document.querySelectorAll('.gender-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white', 'shadow-md');
                btn.classList.add('bg-[#f9f9fa]', 'text-slate-800');
            });

            // Set active state on clicked
            element.classList.remove('bg-[#f9f9fa]', 'text-slate-800');
            element.classList.add('bg-slate-900', 'text-white', 'shadow-md');
            chosenGender = val;
        }

        function submitForm() {
            alert(`Setting up profile for ${chosenGender}!`);
        }
    </script>
</body>
</html>
