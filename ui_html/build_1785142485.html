<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FirstKutAI_Generated_Layout</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f7fa;
    }
    .container {
      width: 253px;
      height: 1534px;
      background-color: white;
    }
    .row-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .column-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
    }
    .text-header {
      color: #f3f3f3;
      margin-bottom: 60px;
    }
    .button {
      background-color: #3187e9;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container"></div>
  <div class="row-container">
    <div class="column-container">
      <div style="background-color: #c2dbf6; width: 670px; height: 1158px;"></div>
      <div style="background-color: #3c8eea; width: 571px; height: 271px;"></div>
    </div>
    <div class="column-container">
      <div class="text-header"></div>
      <div class="text-header"></div>
      <button class="button">Login</button>
    </div>
  </div>
</body>
</html>
